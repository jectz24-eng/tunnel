[package]
name = "tunnel"
version = "0.1.0"
description = "TUNNEL — Quantum Tunneling Protocol on Solana"
edition = "2021"
rust-version = "1.84"
license = "UNLICENSED"

[lib]
crate-type = ["cdylib", "lib"]
name = "tunnel"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build", "orao-solana-vrf/idl-build"]

[dependencies]
anchor-lang = { version = "0.32.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.32.1", default-features = false, features = ["token", "associated_token"] }
orao-solana-vrf = { version = "0.7.0", default-features = false, features = ["cpi"] }
# Pinned for compatibility with the Solana platform-tools rustc (same pin as ORAO's examples).
blake3 = "=1.8.2"
solana-sha256-hasher = "2.3.0"
# Pure-Rust soft-float math (sinh, sqrt) for deriving odds from the physics model.
libm = "0.2"
