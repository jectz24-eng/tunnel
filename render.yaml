# Render Blueprint for TUNNEL: website + cycle engine + PostgreSQL. No smart contract.
# Deploy: push this repo to GitHub, then Render → New → Blueprint → select the repo.
#
# Values marked `sync: false` are entered in the Render dashboard (never committed).
# The engine's reward-wallet keypair is uploaded as a Secret File named reward-wallet.json.
# The web service never holds any key.
#
# Mining starts PAUSED. Resume it from /admin (or `npm run admin -- resume`) only after
# the reward wallet is funded and every item in docs/CHECKLIST.md is done.

databases:
  - name: tunnel-db
    plan: basic-256mb
    databaseName: tunnel
    user: tunnel

services:
  - type: web
    name: tunnel-web
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build -w app
    preDeployCommand: npm run db:migrate
    startCommand: npm run start -w app
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: tunnel-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: NEXT_PUBLIC_CLUSTER
        value: mainnet-beta
      # A dedicated mainnet RPC (Helius, Triton, QuickNode…). Used by browsers for balances only.
      - key: NEXT_PUBLIC_RPC_URL
        sync: false
      # Comma-separated wallet addresses allowed into /admin.
      - key: ADMIN_WALLETS
        sync: false

  - type: worker
    name: tunnel-engine
    runtime: node
    plan: starter
    buildCommand: npm ci
    startCommand: npm run engine
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: tunnel-db
          property: connectionString
      - key: SOLANA_RPC_URL
        sync: false
      - key: TUNNEL_MINT
        sync: false
      # Upload the reward-wallet keypair as Secret File "reward-wallet.json".
      # It holds the $TUNNEL mining reserve and a little SOL for transfer fees.
      - key: REWARD_WALLET_KEYPAIR
        value: /etc/secrets/reward-wallet.json
      # Payouts larger than this (whole $TUNNEL) wait for manual review.
      - key: ENGINE_MAX_PAYOUT_TOKENS
        value: "50000"
      - key: LOG_LEVEL
        value: info
