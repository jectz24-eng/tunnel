# Render Blueprint for TUNNEL: website + cycle engine + PostgreSQL. No smart contract.
# Deploy: push this repo to GitHub, then Render → New → Blueprint → select the repo.
#
# Values marked `sync: false` are entered in the Render dashboard (never committed).
# The reward-wallet key is set on /admin (sealed so only the engine can read it) or uploaded
# to the engine as Secret File reward-wallet.json.
# The web service never holds any key.
#
# FREE PLAN: free Postgres expires 30 days after creation (upgrade before then or lose
# the database). Free web services sleep after 15 min without inbound traffic, including
# the engine, so keep both awake with an uptime pinger on their URLs, or upgrade to paid
# (engine as a `worker`, migrations back in `preDeployCommand`).
#
# Mining starts PAUSED. Resume it from /admin (or `npm run admin -- resume`) only after
# the reward wallet is funded and every item in docs/CHECKLIST.md is done.

databases:
  - name: tunnel-db
    plan: free
    databaseName: tunnel
    user: tunnel

services:
  - type: web
    name: tunnel-web
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build -w app
    # Free instances have no preDeployCommand, so migrations run at start.
    startCommand: npm run db:migrate && npm run start -w app
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: tunnel-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: NEXT_PUBLIC_CLUSTER
        value: mainnet-beta
      # RPC URLs and the $TUNNEL mint are set on /admin → Settings (stored in the database).
      # scrypt hash of the /admin password, from `npm run admin:password-hash -- '<password>'`.
      - key: ADMIN_PASSWORD_HASH
        sync: false

  # A web service only because the free plan has no workers; it serves engine health on $PORT.
  - type: web
    name: tunnel-engine
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm run engine
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: tunnel-db
          property: connectionString
      # SOLANA_RPC_URL / TUNNEL_MINT are optional here: when unset, the engine uses /admin → Settings.
      # The reward wallet holds the $TUNNEL reserve and a little SOL for fees. Set its key on
      # /admin → Settings (sealed in the browser to this engine's key, derived from
      # ENGINE_SEAL_SECRET, which only this service has), or upload it as Secret File
      # "reward-wallet.json", which takes priority.
      - key: ENGINE_SEAL_SECRET
        generateValue: true
      - key: REWARD_WALLET_KEYPAIR
        value: /etc/secrets/reward-wallet.json
      # Payouts larger than this (whole $TUNNEL) wait for manual review.
      - key: ENGINE_MAX_PAYOUT_TOKENS
        value: "50000"
      - key: LOG_LEVEL
        value: info
